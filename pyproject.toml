[project]
name = "rectifill"
version = "0.1.0"
description = "RectiFill: Rectified-Flow Speech Inpainting with T5 Guidance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"g2p-en>=2.1.0",
	"librosa",
	"lightning>=2.6.1",
	"loguru>=0.7.3",
	"matplotlib>=3.10.8",
	"nltk>=3.9.4",
	"numpy",
	"ruff>=0.15.1",
	"scipy",
	"speechbrain>=1.1.0",
	"torch",
	"torchaudio",
	"torchcodec",
	"tqdm>=4.67.3",
	"transformers",
	"wandb>=0.25.1",
]
